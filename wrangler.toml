name = "content-agent"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "RUNS_KV"
id = "f56f7c53bd5546a3a58df2b6412658e3"
preview_id = "25fd87d932584ce39425d170fdabf222"

# Secrets (set via `wrangler secret put <NAME>`, not stored here):
#   ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY,
#   NOTION_TOKEN, NOTION_DATA_SOURCE_ID, ACCESS_TOKEN
#
# ACCESS_TOKEN is a password, not a plain var like the flags below — never put
# its real value in this file (it's committed to git). Set it -> every /api/*
# request needs header X-Access-Token to match, or gets 401; the static page
# stays open either way. Unset -> no auth at all (default).
#
# Optional plain var overrides:
# [vars]
# CONTENT_AGENT_MODEL = "claude-opus-5"
# # "true" => mỗi lượt truy cập chỉ được chạy pipeline một lần.
# SINGLE_RUN_PER_VISIT = "true"
# # "true" => đổ nguyên văn lỗi nhà cung cấp vào log thô của lần chạy.
# SHOW_PROVIDER_ERRORS = "true"
