## Chỉ dùng cho `wrangler dev` cục bộ. `workerd` (runtime của wrangler dev) cần
## glibc >= 2.35; máy này là Ubuntu 20.04 (glibc 2.31) nên phải chạy trong
## container base mới hơn. `wrangler deploy` KHÔNG cần container này — nó chỉ
## bundle bằng esbuild rồi upload, chạy thẳng trên host là đủ.
name: content-agent

services:
  wrangler-dev:
    image: node:20-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - wrangler_node_modules:/app/node_modules
      # npm cache riêng, không dùng chung với host — glibc/arch trong container
      # khác host nên cache tarball vẫn hợp lệ, nhưng tách ra cho sạch.
      - wrangler_npm_cache:/root/.npm
      # Dùng lại phiên đăng nhập `wrangler login` đã có sẵn trên host thay vì
      # phải login lại trong container.
      - ${HOME}/.config/.wrangler:/root/.config/.wrangler
    ports:
      - "8787:8787"
      - "9229:9229"
    # NPM_CONFIG_UPDATE_NOTIFIER=false: lệnh "kiểm tra bản mới" của npm hay treo
    # vô thời hạn trong môi trường sandbox mạng hạn chế — tắt hẳn cho chắc.
    # Chỉ install lại khi node_modules rỗng (volume trống ở lần chạy đầu).
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    command: >
      sh -c "[ -d node_modules/wrangler ] || npm install --no-audit --no-fund;
             npx wrangler dev --ip 0.0.0.0"

volumes:
  wrangler_node_modules:
  wrangler_npm_cache:
